model:
  arch: bita_opt
  model_type: caption_rsicd_opt2.7b
  use_grad_checkpoint: False

datasets:
  #   nwpu_caption:
  #   ucm_caption:
  #    sonicdrivein_caption:
  #   mcdonalds_switzerland_caption:
   rsicd_caption:
     vis_processor:
         eval:
           name: "bita_image_eval"
           image_size: 224
     text_processor:
         eval:
           name: "bita_caption"


run:
  task: captioning
  batch_size_train: 48
  batch_size_eval: 48
  num_workers: 0

  max_len: 22
  min_len: 5
  num_beams: 5

  seed: 42
  output_dir: "output/"

  evaluate: True
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
